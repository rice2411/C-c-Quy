<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tiệm Bánh Cúc Quy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4abab9"/>
      <stop offset="1" stop-color="#369392"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Chef hat (toque) -->
  <g fill="#ffffff">
    <circle cx="186" cy="214" r="66"/>
    <circle cx="326" cy="214" r="66"/>
    <circle cx="256" cy="172" r="88"/>
    <rect x="182" y="250" width="148" height="120" rx="24"/>
  </g>
  <!-- Pleats (teal) gợi nếp gấp mũ -->
  <g stroke="#4abab9" stroke-width="9" stroke-linecap="round" opacity="0.9">
    <line x1="224" y1="280" x2="224" y2="352"/>
    <line x1="256" y1="278" x2="256" y2="354"/>
    <line x1="288" y1="280" x2="288" y2="352"/>
  </g>
</svg>
