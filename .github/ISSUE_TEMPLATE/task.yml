name: "Task / Bug / Feature"
description: "Issue chuẩn CucQuy — BẮT BUỘC có phạm vi đầy đủ + Evidence TRƯỚC."
labels: []
body:
  - type: dropdown
    id: type
    attributes:
      label: Loại
      options: [bug, feature, refactor, chore]
    validations: { required: true }

  - type: textarea
    id: description
    attributes:
      label: Mô tả
      description: Bối cảnh, hiện tượng/lỗi, mục tiêu.
      placeholder: "Khi ... thì ... (kèm log nếu có)"
    validations: { required: true }

  - type: textarea
    id: scope
    attributes:
      label: TOÀN BỘ phạm vi (file:dòng)
      description: Rà cả app, liệt kê ĐẦY ĐỦ mọi file:dòng/khu vực ảnh hưởng; đánh dấu rõ chỗ KHÔNG sửa.
      placeholder: |
        - pages/X/index.tsx:42 — ...
        - KHÔNG đụng: pages/Y (lý do)
    validations: { required: true }

  - type: textarea
    id: evidence-before
    attributes:
      label: "📸 Evidence TRƯỚC (BẮT BUỘC)"
      description: |
        Chứng minh hiện trạng/lỗi TRƯỚC khi sửa.
        • UI → ảnh (kéo-thả vào đây hoặc raw URL `![](...)`).
        • BE/SQL/refactor → snippet code / `git diff` hiện trạng (```code```).
        KHÔNG có loại issue nào được miễn — "chỉ dọn code" vẫn phải có snippet TRƯỚC.
      placeholder: "![before](https://...)  HOẶC  ```ts\n// code hiện tại\n```"
    validations: { required: true }

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Checklist điều kiện hoàn thành.
      value: |
        - [ ] ...
        - [ ] tsc/build pass, scan UI pass (nếu FE)
        - [ ] Evidence SAU đính ở MR (before + after)
    validations: { required: true }
