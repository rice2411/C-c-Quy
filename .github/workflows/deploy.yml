name: Deploy Frontend

# Push lên production → build image trên runner GitHub → push GHCR → VPS pull.
# VPS KHÔNG build nữa (tránh OOM máy 1.4GB).
on:
  push:
    branches: [production]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/cucquy/cucquy-frontend

jobs:
  # 1) CI — gate nhanh: code biên dịch được không
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsc --noEmit

  # 2) Build image + push GHCR (VITE_API_URL bake lúc build)
  build-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=https://api.cucquy.site/api
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # 3) Deploy — SSH vào VPS: login GHCR, pull image mới, chạy lại container
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull ghcr.io/cucquy/cucquy-frontend:latest
            docker stop cucquy-frontend || true
            docker rm cucquy-frontend || true
            docker run -d --name cucquy-frontend --restart unless-stopped -p 127.0.0.1:8080:80 ghcr.io/cucquy/cucquy-frontend:latest
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
