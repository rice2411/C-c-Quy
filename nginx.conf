server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Nén tĩnh
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Asset có hash → cache vĩnh viễn. ^~ để regex bên dưới KHÔNG chiếm location này.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Asset tĩnh ở root (icon, manifest, og-image...): thiếu thì 404 — KHÔNG fallback index.html.
  # Tránh file chưa tồn tại bị trả HTML rồi Cloudflare cache nhầm dưới URL asset.
  location ~* \.(svg|png|ico|jpg|jpeg|webp|webmanifest|json|txt|xml)$ {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  # SPA: route còn lại fallback index.html (app dùng hash router).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
