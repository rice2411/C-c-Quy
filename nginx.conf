server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Nén tĩnh
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # SPA: mọi route fallback về index.html (app dùng hash router nên chủ yếu phục vụ tĩnh)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache asset có hash
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
